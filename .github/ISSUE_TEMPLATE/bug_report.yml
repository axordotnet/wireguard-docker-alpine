name: Bug report
description: Report a reproducible problem without secrets
title: '[Bug] '
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Image version/digest, host OS, Docker version; never include keys.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected and actual behavior
    validations:
      required: true
