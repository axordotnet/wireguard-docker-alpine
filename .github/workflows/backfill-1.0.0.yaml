name: Backfill image 1.0.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/backfill-1.0.0.yaml']
permissions:
  contents: read
  packages: write
concurrency:
  group: backfill-1.0.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/1.0.0
      - name: Verify release source and test tunnel
        run: |
          test "$(git rev-parse HEAD)" = dad45a06bef9b65dc4c5fc7fcf593c9900f7b7a9
          docker build --pull -t wireguard-test .
          bash tests/tunnel.sh wireguard-test
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an existing version
        run: |
          if docker buildx imagetools inspect ghcr.io/axordotnet/wireguard-docker-alpine:1.0.0 >/dev/null 2>&1; then
            echo "Version 1.0.0 already exists; refusing to overwrite."
            exit 1
          fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: ghcr.io/axordotnet/wireguard-docker-alpine:1.0.0
          labels: |
            org.opencontainers.image.version=1.0.0
            org.opencontainers.image.revision=dad45a06bef9b65dc4c5fc7fcf593c9900f7b7a9
          provenance: mode=max
          sbom: true
