name: Validate and publish image
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and test
        run: |
          sh -n entrypoint.sh
          bash -n tests/tunnel.sh
          shellcheck entrypoint.sh tests/tunnel.sh
          docker compose config --quiet
          docker build --pull --no-cache -t wireguard-test .
          bash tests/tunnel.sh wireguard-test
      - name: Report all image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: wireguard-test
          scanners: vuln
          exit-code: '0'
          format: table
      - name: Reject fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          image-ref: wireguard-test
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  publish:
    needs: test
    if: >-
      github.repository == 'axordotnet/wireguard-docker-alpine' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          [[ "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/axordotnet/wireguard-docker-alpine
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=long
      - name: Refuse an existing release image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          if docker buildx imagetools inspect "ghcr.io/axordotnet/wireguard-docker-alpine:$version" >/dev/null 2>&1; then
            echo 'Version already exists; choose a new release version.'
            exit 1
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ghcr.io/axordotnet/wireguard-docker-alpine:build-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Test the exact candidate
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/axordotnet/wireguard-docker-alpine@$DIGEST"
          docker pull "$image"
          bash tests/tunnel.sh "$image"
      - name: Scan the exact candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ghcr.io/axordotnet/wireguard-docker-alpine@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Promote tested and scanned candidate
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${args[@]}" "ghcr.io/axordotnet/wireguard-docker-alpine@$DIGEST"
          echo "Published digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
  verify-public-image:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify anonymous pull
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          docker pull "ghcr.io/axordotnet/wireguard-docker-alpine@$DIGEST"
          docker run --rm --network none --entrypoint wg "ghcr.io/axordotnet/wireguard-docker-alpine@$DIGEST" --version
