services:
  wireguard:
    image: ghcr.io/axordotnet/wireguard-docker-alpine:1.1.0
    # For a local build: docker compose build
    build: .
    network_mode: host
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
    cap_add:
      - NET_ADMIN
      # Read mode-0600 bind mounts owned by a different host UID.
      - DAC_READ_SEARCH
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      WG_IMPLEMENTATION: auto
    volumes:
      - type: bind
        source: ./wg-proxy.conf
        target: /etc/wireguard/wg-proxy.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, /usr/local/bin/wireguard-healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
